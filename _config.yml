title: Jack Skidmore
description: Essays, prayers, and projects from Jack Skidmore.
baseurl: ""
url: "https://jackskidmore.com"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md

# Highlight the Writing nav pill on project pages (and any page can override
# its active pill with `nav_active:` in front matter).
defaults:
  - scope:
      path: "projects"
    values:
      nav_active: /writing/
  - scope:
      path: "essays"
    values:
      nav_active: /writing/
  - scope:
      path: "prayers"
    values:
      nav_active: /writing/
  - scope:
      path: "updates"
    values:
      nav_active: /
  # Unlisted share-by-link files: kept out of listings, sitemaps, and search.
  - scope:
      path: "preview"
    values:
      exclude: true
      sitemap: false
      noindex: true
